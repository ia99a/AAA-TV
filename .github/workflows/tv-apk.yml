name: TV APK
# Builds an installable debug APK of this branch and publishes it as the "tv-latest" release,
# so the TV can download it directly (for example with the Downloader app):
#   https://github.com/<owner>/<repo>/releases/download/tv-latest/sva-tv.apk
on:
  push:
    branches: [prayer-tab]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; then
            # Surface the first compiler and Gradle errors as annotations, readable without the raw log.
            grep -E "error:|\.java:[0-9]+: |What went wrong|^> |FAILURE|Exception" build.log \
              | grep -v "^> Task" | head -40 | while IFS= read -r line; do
                echo "::error::${line//$'\r'/}"
              done
            exit 1
          fi
      - name: Keep the APK with this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sva-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish to the tv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sva-tv.apk
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest sva-tv.apk --target "$GITHUB_SHA" \
            --title "Sva TV (latest)" --notes "Built from ${GITHUB_SHA::7}" --prerelease
