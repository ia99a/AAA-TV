plugins {
    id "com.android.application"
}

android {
    namespace "com.sva.launcher"

    compileSdk 36

    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId "com.sva.launcher"

        minSdk 26
        targetSdk 36

        // Every CI build gets a higher version, so the TV always accepts it as an update.
        versionCode 100 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionName "4.2." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        testInstrumentationRunner "android.test.InstrumentationTestRunner"

        // The built-in NES emulator is not used in this TV build, so its native code is left out:
        // a smaller APK that starts faster and uses less memory.
    }

    sourceSets {
        androidTest.assets.srcDirs += ["../third_party/nestopia/source/nes_ntsc/tests"]
    }

    // A source checkout builds unsigned releases without access to a maintainer's key.
    def signingEnvironment = ["SVA_KEYSTORE_PATH", "SVA_STORE_PASSWORD", "SVA_KEY_ALIAS", "SVA_KEY_PASSWORD"]
    def hasReleaseSigning = signingEnvironment.every { System.getenv(it)?.trim() }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(System.getenv("SVA_KEYSTORE_PATH"))
                storePassword System.getenv("SVA_STORE_PASSWORD")
                keyAlias System.getenv("SVA_KEY_ALIAS")
                keyPassword System.getenv("SVA_KEY_PASSWORD")
            }
        }
    }

    // One fixed key for the TV builds. Without it each CI runner made a new debug key, and the TV
    // refused to install an update over the previous build ("App not installed").
    signingConfigs {
        tv {
            storeFile file("aaa-tv.p12")
            storeType "pkcs12"
            storePassword "aaatv-sideload"
            keyAlias "aaatv"
            keyPassword "aaatv-sideload"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tv
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }

}

dependencies {
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.runner.jar",
            "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.base.jar")
    def media3Version = "1.8.1"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
